<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- 
    OPEN GRAPH IMAGE PLACEHOLDER
    Replace this with a JPG/PNG image (1200x630 pixels) for social media sharing.
    Name it og-image.jpg and update config/site.ts ogImage path.
  -->
  <rect width="1200" height="630" fill="#030712"/>
  <defs>
    <linearGradient id="ogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#ogGrad)"/>
  <!-- Grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(6,182,212,0.08)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Shield -->
  <path d="M600 180 L520 220v80c0 60 40 115 80 130 40-15 80-70 80-130V220L600 180z" fill="#06b6d4" opacity="0.9"/>
  <path d="M600 210 L545 240v60c0 45 30 85 55 95 25-10 55-50 55-95v-60L600 210z" fill="#030712"/>
  <circle cx="600" cy="270" r="20" fill="#06b6d4"/>
  <!-- Text -->
  <text x="600" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="64" font-weight="700" fill="#f9fafb">Ademzweb</text>
  <text x="600" y="460" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" fill="#9ca3af">Enterprise Cybersecurity Solutions</text>
</svg>
